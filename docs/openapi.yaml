openapi: 3.0.0
info:
  title: Raven
  version: 0.0.0
tags:
  - name: Auth
  - name: Users
  - name: Me
  - name: Onboarding
paths:
  /auth/check-email:
    get:
      operationId: Auth_checkEmail
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      exists:
                        type: boolean
                    required:
                      - exists
                description: Success response wrapper with data
      tags:
        - Auth
  /auth/login:
    post:
      operationId: Auth_login
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                    required:
                      - accessToken
                      - refreshToken
                description: Success response wrapper with data
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                password:
                  type: string
              required:
                - identifier
                - password
  /auth/logout:
    post:
      operationId: Auth_logout
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Logged out successfully.
                required:
                  - success
                  - message
      tags:
        - Auth
      security:
        - BearerAuth: []
  /auth/password/change:
    post:
      operationId: Password_changePassword
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Password changed successfully.
                required:
                  - success
                  - message
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
              required:
                - currentPassword
                - newPassword
      security:
        - BearerAuth: []
  /auth/password/forgot:
    post:
      operationId: Password_forgotPassword
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Password reset code sent to email.
                required:
                  - success
                  - message
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                recaptchaToken:
                  type: string
              required:
                - email
                - recaptchaToken
  /auth/password/resend-otp:
    post:
      operationId: Password_resendOtpPassword
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - otp resent successfully.
                required:
                  - success
                  - message
      tags:
        - Auth
      security:
        - BearerAuth: []
  /auth/password/reset:
    post:
      operationId: Password_resetPassword
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Password reset successfully.
                required:
                  - success
                  - message
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                otp:
                  type: string
                newPassword:
                  type: string
              required:
                - token
                - otp
                - newPassword
  /auth/refresh-token:
    post:
      operationId: Auth_refreshToken
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                    required:
                      - accessToken
                      - refreshToken
                description: Success response wrapper with data
      tags:
        - Auth
  /auth/register/complete:
    post:
      operationId: Register_completeRegister
      summary: Complete the registration process by setting a password
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                    required:
                      - accessToken
                      - refreshToken
                description: Success response wrapper with data
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                creationToken:
                  type: string
                password:
                  type: string
              required:
                - creationToken
                - password
  /auth/register/resend-otp:
    post:
      operationId: Register_resendOtp
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - otp resent successfully.
                required:
                  - success
                  - message
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                creationToken:
                  type: string
              required:
                - creationToken
  /auth/register/start:
    post:
      operationId: Register_startRegister
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      creationToken:
                        type: string
                    required:
                      - creationToken
                description: Success response wrapper with data
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterStartBody'
  /auth/register/verify:
    post:
      operationId: Register_verifyRegister
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Registration verified successfully.
                required:
                  - success
                  - message
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                creationToken:
                  type: string
                otp:
                  type: string
              required:
                - creationToken
                - otp
  /auth/{provider}/callback:
    post:
      operationId: Oauth_handleOauthCallback
      summary: Handle OAuth callback for a given provider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                    required:
                      - accessToken
                      - refreshToken
                description: Success response wrapper with data
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider_token_id:
                  type: string
              required:
                - provider_token_id
  /me:
    get:
      operationId: Me_getMyProfile
      summary: Get the authenticated user's profile
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AuthenticatedUser'
                description: Success response wrapper with data
      tags:
        - Me
      security:
        - BearerAuth: []
    patch:
      operationId: Me_updateMyProfile
      summary: Update the authenticated user's profile
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AuthenticatedUser'
                description: Success response wrapper with data
      tags:
        - Me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      security:
        - BearerAuth: []
  /me/banner:
    post:
      operationId: Me_updateBanner
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Banner updated successfully.
                required:
                  - success
                  - message
      tags:
        - Me
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                banner:
                  type: string
                  format: binary
              required:
                - banner
            encoding:
              banner:
                contentType: '*/*'
      security:
        - BearerAuth: []
    delete:
      operationId: Me_deleteBanner
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Banner deleted successfully.
                required:
                  - success
                  - message
      tags:
        - Me
      security:
        - BearerAuth: []
  /me/blocks:
    get:
      operationId: Blocks_listUserBlocks
      summary: List a user's blocks
      parameters:
        - $ref: '#/components/parameters/CursorPaginationParameters.cursor'
        - $ref: '#/components/parameters/CursorPaginationParameters.limit'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - pagination
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactUser'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
                description: Success response wrapper with data and pagination
      tags:
        - Me
      security:
        - BearerAuth: []
  /me/blocks/{username}:
    post:
      operationId: Blocks_blockUser
      summary: Block a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - user blocked successfully
                required:
                  - success
                  - message
      tags:
        - Me
      security:
        - BearerAuth: []
    delete:
      operationId: Blocks_unblockUser
      summary: Unblock a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - user unblocked successfully
                required:
                  - success
                  - message
      tags:
        - Me
      security:
        - BearerAuth: []
  /me/mutes:
    get:
      operationId: Mutes_listUserMutes
      summary: List a user's mutes
      parameters:
        - $ref: '#/components/parameters/CursorPaginationParameters.cursor'
        - $ref: '#/components/parameters/CursorPaginationParameters.limit'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - pagination
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactUser'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
                description: Success response wrapper with data and pagination
      tags:
        - Me
      security:
        - BearerAuth: []
  /me/mutes/{username}:
    post:
      operationId: Mutes_muteUser
      summary: Mute a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - user muted successfully
                required:
                  - success
                  - message
      tags:
        - Me
      security:
        - BearerAuth: []
    delete:
      operationId: Mutes_unmuteUser
      summary: Unmute a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - user unmuted successfully
                required:
                  - success
                  - message
      tags:
        - Me
      security:
        - BearerAuth: []
  /me/password:
    put:
      operationId: Me_changeMyPassword
      summary: Change the authenticated user's password
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Password changed successfully.
                required:
                  - success
                  - message
      tags:
        - Me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
              required:
                - currentPassword
                - newPassword
      security:
        - BearerAuth: []
  /me/profile-picture:
    post:
      operationId: Me_updateProfilePicture
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Profile picture updated successfully.
                required:
                  - success
                  - message
      tags:
        - Me
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                profilePicture:
                  type: string
                  format: binary
              required:
                - profilePicture
            encoding:
              profilePicture:
                contentType: '*/*'
      security:
        - BearerAuth: []
    delete:
      operationId: Me_deleteProfilePicture
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Profile picture deleted successfully.
                required:
                  - success
                  - message
      tags:
        - Me
      security:
        - BearerAuth: []
  /me/username:
    patch:
      operationId: Me_changeMyUsername
      summary: Change the authenticated user's username
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Username changed successfully.
                required:
                  - success
                  - message
      tags:
        - Me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newUsername:
                  type: string
      security:
        - BearerAuth: []
  /onboarding/follow-suggestions:
    get:
      operationId: Onboarding_getFollowSuggestions
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      suggestions:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserMetadata'
                    required:
                      - suggestions
                description: Success response wrapper with data
      tags:
        - Onboarding
      security:
        - BearerAuth: []
  /onboarding/username-suggestions:
    get:
      operationId: Onboarding_getUsernameSuggestions
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      suggestions:
                        type: array
                        items:
                          type: string
                    required:
                      - suggestions
                description: Success response wrapper with data
      tags:
        - Onboarding
      security:
        - BearerAuth: []
  /users/{username}/followers:
    get:
      operationId: Follows_listUserFollowers
      summary: List a user's followers
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CursorPaginationParameters.cursor'
        - $ref: '#/components/parameters/CursorPaginationParameters.limit'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - pagination
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string
                          minLength: 1
                          description: The user's unique, public-facing username.
                        displayName:
                          type: string
                          minLength: 1
                          maxLength: 100
                          description: The user's display name.
                        bio:
                          type: string
                          nullable: true
                          maxLength: 160
                          description: The user's bio (max 160 characters).
                        bioEntities:
                          type: object
                          allOf:
                            - $ref: '#/components/schemas/BioEntities'
                          nullable: true
                          description: Entities in the bio (mentions and hashtags)
                        avatarUrl:
                          type: string
                          nullable: true
                          description: URL to the user's avatar image
                        isFollowing:
                          type: boolean
                      required:
                        - username
                        - displayName
                        - bio
                        - bioEntities
                        - avatarUrl
                        - isFollowing
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
                description: Success response wrapper with data and pagination
      tags:
        - Users
      security:
        - BearerAuth: []
  /users/{username}/following:
    get:
      operationId: Following_listUserFollowing
      summary: List users a user is following
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CursorPaginationParameters.cursor'
        - $ref: '#/components/parameters/CursorPaginationParameters.limit'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - pagination
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompactUser'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
                description: Success response wrapper with data and pagination
      tags:
        - Users
      security:
        - BearerAuth: []
    post:
      operationId: Following_followUser
      summary: Follow a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - user followed successfully
                required:
                  - success
                  - message
      tags:
        - Users
      security:
        - BearerAuth: []
    delete:
      operationId: Following_unfollowUser
      summary: Unfollow a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - user unfollowed successfully
                required:
                  - success
                  - message
      tags:
        - Users
      security:
        - BearerAuth: []
  /users/{username}/mutual:
    get:
      operationId: Follows_listMutualFollowers
      summary: List mutual followers with a user given their username
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CursorPaginationParameters.cursor'
        - $ref: '#/components/parameters/CursorPaginationParameters.limit'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - pagination
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
