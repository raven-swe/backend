name: Code Style & Quality Checks
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

jobs:
  style-quality:
    name: Code Style & Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@latest --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Formatter
        run: pnpm run format:check

      - name: Run Linter
        run: pnpm run lint:check

      - name: Run Unit Tests
        run: pnpm run test:cov

      - name: Comment Coverage on PR
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage/lcov.info
          filter-changed-files: true
          delete-old-comments: true
          title: Unit Tests Coverage Report

      - name: Checkout Base Branch
        if: ${{ github.base_ref != 'main' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Generate OpenAPI spec yaml files for base branch
        if: ${{ github.base_ref != 'main' }}
        run: |
          cd base
          pnpm run spec:generate

      - name: Generate OpenAPI spec yaml files for head branch
        if: ${{ github.base_ref != 'main' }}
        run: |
          cd .
          pnpm run spec:generate

      - name: Run OpenAPI Diff (from HEAD revision)
        if: ${{ github.base_ref != 'main' }}
        uses: LimeFlight/openapi-diff-action@master
        with:
          head_spec: openapi.yaml
          base_spec: base/openapi.yaml
          output_path: ./output
          github_token: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        if: ${{ github.base_ref != 'main' }}
        with:
          name: diff-reports
          path: ./output
